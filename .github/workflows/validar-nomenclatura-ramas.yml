name: Validar nomenclatura rama

on:
  pull_request:
    branches:
      - PRE
      - PRO

permissions:
  contents: read

jobs:
  validar-rama-pro:
    name: validar-rama-pro
    runs-on: windows-latest

    steps:
      - name: Validar nombre de rama
        shell: pwsh
        env:
          RAMA_DESTINO: ${{ github.base_ref }}
          RAMA_ORIGEN: ${{ github.head_ref }}
        run: |
          switch -CaseSensitive ($env:RAMA_DESTINO) {
            "PRO" {
              $prefijo = "hotfix"
            }
            "PRE" {
              $prefijo = "feature"
            }
            default {
              Write-Host "No hay una regla para esta rama de destino."
              exit 0
            }
          }

          $patronTicket = "^$prefijo/[0-9]+-.+$"
          $patronRelease = '^release/.+$'

          Write-Host "Destino: $env:RAMA_DESTINO"
          Write-Host "Origen: $env:RAMA_ORIGEN"

          $ticketValido = $env:RAMA_ORIGEN -cmatch $patronTicket
          $releaseValida = $env:RAMA_ORIGEN -cmatch $patronRelease

          if (-not ($ticketValido -or $releaseValida)) {
            Write-Host "::error::Para integrar en $env:RAMA_DESTINO, utiliza $prefijo/<ticket>-<descripcion> o release/<nombre>. Ejemplos: $prefijo/1234-corregir-login o release/version-octubre"
            exit 1
          }

          Write-Host "Nombre de rama valido."
