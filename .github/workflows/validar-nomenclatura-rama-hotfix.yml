name: Validar nomenclatura de rama HotFix

on:
  pull_request:
    branches:
      - PRO

permissions:
  contents: read

jobs:
  validar-rama-pro:
    name: validar-rama-pro
    runs-on: windows-latest

    steps:
      - name: Validar nombre de rama
        shell: pwsh
        env:
          RAMA_DESTINO: ${{ github.base_ref }}
          RAMA_ORIGEN: ${{ github.head_ref }}
        run: |
          Write-Host "Destino: $env:RAMA_DESTINO"
          Write-Host "Origen: $env:RAMA_ORIGEN"

          if ($env:RAMA_DESTINO -cne "PRO") {
            Write-Host "La validacion solo se aplica a PRO."
            exit 0
          }

          $patron = '^hotfix/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'

          if ($env:RAMA_ORIGEN -cnotmatch $patron) {
            Write-Host "::error::Para integrar en PRO, utiliza hotfix/<ticket>-<descripcion>. Ejemplo: hotfix/1234-corregir-login"
            exit 1
          }

          Write-Host "Nombre de rama valido."
