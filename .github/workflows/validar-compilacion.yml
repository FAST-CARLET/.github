name: Validar compilacion

on:
  pull_request:
    branches:
      - PRE
      - PRO

permissions:
  contents: read
  packages: read

jobs:
  compilar:
    name: Compilar soluciones
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar NuGet
        uses: NuGet/setup-nuget@v2

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $origen = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

          $origenExistente = nuget sources List |
            Select-String -SimpleMatch "GitHubPackages"

          if ($origenExistente) {
            nuget sources Remove `
              -Name "GitHubPackages" `
              -NonInteractive
          }

          nuget sources Add `
            -Name "GitHubPackages" `
            -Source $origen `
            -Username "${{ github.actor }}" `
            -Password $env:GITHUB_TOKEN `
            -StorePasswordInClearText `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
            Write-Error "No se ha podido configurar GitHub Packages."
            exit $LASTEXITCODE
          }

      - name: Buscar soluciones
        shell: pwsh
        run: |
          $soluciones = Get-ChildItem -Path . -Filter *.sln -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\(bin|obj|packages|node_modules)\\'
            }

          if ($soluciones.Count -eq 0) {
            Write-Error "No se ha encontrado ningun archivo .sln en el repositorio."
            exit 1
          }

          Write-Host "Soluciones encontradas:"

          foreach ($solucion in $soluciones) {
            Write-Host " - $($solucion.FullName)"
          }

      - name: Restaurar paquetes NuGet
        shell: pwsh
        run: |
          $soluciones = Get-ChildItem -Path . -Filter *.sln -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\(bin|obj|packages|node_modules)\\'
            }

          foreach ($solucion in $soluciones) {
            Write-Host "Restaurando: $($solucion.FullName)"

            nuget restore $solucion.FullName -NonInteractive

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Ha fallado la restauracion de $($solucion.Name)."
              exit $LASTEXITCODE
            }
          }

      - name: Compilar soluciones
        shell: pwsh
        run: |
          $soluciones = Get-ChildItem -Path . -Filter *.sln -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\(bin|obj|packages|node_modules)\\'
            }

          foreach ($solucion in $soluciones) {
            Write-Host "Compilando: $($solucion.FullName)"

            msbuild $solucion.FullName `
              /p:Configuration=Release `
              /m `
              /nologo

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Ha fallado la compilacion de $($solucion.Name)."
              exit $LASTEXITCODE
            }
          }
